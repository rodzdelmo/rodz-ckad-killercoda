apiVersion: v1
kind: Pod
metadata:
  name: web-nodeaffinity
  namespace: place-ops
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: zone
                operator: In
                values:
                  - us-west-1a
  containers:
    - name: web
      image: nginx:1.25
