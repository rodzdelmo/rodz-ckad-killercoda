apiVersion: v1
kind: Namespace
metadata:
  name: guard-ops
---
apiVersion: v1
kind: Pod
metadata:
  name: policy-checker
  namespace: guard-ops
spec:
  securityContext:
    runAsUser: 1002
  nodeSelector:
    disktype: ssd
  containers:
    - name: checker
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
