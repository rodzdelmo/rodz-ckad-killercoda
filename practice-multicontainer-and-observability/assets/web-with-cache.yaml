apiVersion: v1
kind: Namespace
metadata:
  name: edge-ops
---
apiVersion: v1
kind: Pod
metadata:
  name: web-with-cache
  namespace: edge-ops
spec:
  initContainers:
    - name: cache-warmer
      image: busybox:1.36
      command: ["sh", "-c", "echo warming > /tmp/cache-ready"]
  containers:
    - name: web
      image: nginx:1.25
