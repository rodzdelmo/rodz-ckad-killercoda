apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-cleanup
  namespace: batch-ops
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Always
          containers:
            - name: cleanup
              image: busybox:1.36
              command: ["sh", "-c", "echo cleaning up; sleep 5"]
