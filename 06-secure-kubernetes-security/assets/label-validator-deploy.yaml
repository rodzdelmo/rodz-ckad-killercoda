apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-validator
  namespace: production-ops
  labels:
    app: label-validator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: label-validator
  template:
    metadata:
      labels:
        app: label-validator
    spec:
      containers:
        - name: label-validator
          image: python:3.11-slim
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: code
              mountPath: /app
            - name: tls
              mountPath: /etc/webhook
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: label-validator-code
        - name: tls
          secret:
            secretName: label-validator-tls
---
apiVersion: v1
kind: Service
metadata:
  name: label-validator
  namespace: production-ops
spec:
  selector:
    app: label-validator
  ports:
    - port: 443
      targetPort: 8443
