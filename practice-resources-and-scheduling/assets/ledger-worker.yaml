apiVersion: v1
kind: Namespace
metadata:
  name: ledger-ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-sa
  namespace: ledger-ops
---
apiVersion: v1
kind: Pod
metadata:
  name: ledger-worker
  namespace: ledger-ops
spec:
  serviceAccountName: ledger-sa
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
