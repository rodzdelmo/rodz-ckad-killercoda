apiVersion: v1
kind: Namespace
metadata:
  name: gpu-ops
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-idle
  namespace: gpu-ops
spec:
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  containers:
    - name: idle
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-job
  namespace: gpu-ops
spec:
  containers:
    - name: job
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
