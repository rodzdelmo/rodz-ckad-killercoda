apiVersion: v1
kind: Pod
metadata:
  name: report-writer
  namespace: analytics-ops
spec:
  initContainers:
    - name: init-report-dir
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /data/reports/2024"]
      volumeMounts:
        - name: analytics-data
          mountPath: /data
  containers:
    - name: report-writer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: analytics-data
          mountPath: /output
          subPath: reports/2025
  volumes:
    - name: analytics-data
      persistentVolumeClaim:
        claimName: analytics-writer
