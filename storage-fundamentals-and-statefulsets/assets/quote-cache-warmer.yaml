apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-cache-warmer
  namespace: content-ops
  labels:
    app: quote-cache-warmer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote-cache-warmer
  template:
    metadata:
      labels:
        app: quote-cache-warmer
    spec:
      containers:
        - name: quote-cache-warmer
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/cache/quotes && touch /var/cache/quotes/index.db && sleep 3600"]
