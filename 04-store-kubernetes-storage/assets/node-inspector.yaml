apiVersion: v1
kind: Pod
metadata:
  name: node-inspector
  namespace: platform-ops
spec:
  containers:
    - name: node-inspector
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: varlog
          mountPath: /host-var-log
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
        type: File
