    matchLabels:
      app: invoice-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        # TODO: one entry, with BOTH selectors below, so it means
        # "billing-ui pods, in the billing-ops namespace" (AND, not OR).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: # TODO
          podSelector:
            matchLabels:
              app: # TODO
      ports:
        - protocol: TCP
          port: 8080
